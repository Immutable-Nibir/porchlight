<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Porchlight</title>
<style>
/* ===== CUSTOMIZE HERE (colors) ===== */
:root{--bg:#e9eef3;--card:#fff;--ink:#16222d;--soft:#5d6b79;--line:#d6dee6;--accent:#2563d9;--accent-ink:#fff;--warm:#f0a431;--danger:#c63b3b}
@media (prefers-color-scheme:dark){:root{--bg:#0f161d;--card:#18222c;--ink:#e8eef4;--soft:#93a2b1;--line:#2a3846;--accent:#5b92f5;--accent-ink:#0b1320;--warm:#f0a431;--danger:#ef7a7a}}
/* ===== END CUSTOMIZE ===== */
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Trebuchet MS","Segoe UI",system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 16px}
.logo{font-weight:800;font-size:22px;letter-spacing:-.5px;color:var(--accent);display:flex;align-items:center;gap:8px}
.logo i{width:12px;height:12px;border-radius:50%;background:var(--warm);box-shadow:0 0 0 4px rgba(240,164,49,.28)}
.spacer{flex:1}
main{max-width:620px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
input,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;margin-top:8px}
textarea{resize:vertical;min-height:70px}
button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:9px 16px;background:var(--accent);color:var(--accent-ink);font-weight:700}
button.ghost{background:transparent;color:var(--soft);font-weight:600;padding:6px 10px}
button.ghost:hover{color:var(--ink);background:var(--bg)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tabs{display:flex;gap:6px;margin-bottom:6px}
.tabs button{flex:1;background:var(--bg);color:var(--soft)}
.tabs button.on{background:var(--accent);color:var(--accent-ink)}
.err{color:var(--danger);min-height:20px;margin:8px 0 0;font-size:14px}
.hint{color:var(--soft);font-size:14px;margin:4px 0 0}
.row{display:flex;align-items:center;gap:8px}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;flex:none}
.name{font-weight:700;cursor:pointer;background:none;color:var(--ink);padding:0}
.name:hover{text-decoration:underline}
.time{color:var(--soft);font-size:13px}
.text{white-space:pre-wrap;word-wrap:break-word;margin:10px 0}
.photo{width:100%;border-radius:8px;display:block;margin-top:8px;max-height:640px;object-fit:cover}
.prev{position:relative;margin-top:8px}
.prev img{width:100%;max-height:260px;object-fit:cover;border-radius:8px}
.prev button{position:absolute;top:6px;right:6px;padding:4px 10px}
.actions{display:flex;gap:4px;margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
.liked{color:var(--accent)!important}
.empty{text-align:center;color:var(--soft);padding:28px 10px}
.bar{display:flex;justify-content:space-between;align-items:center}
.hidden{display:none!important}

/* bottom bar, profile page */
main{padding-bottom:90px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:5;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;gap:6px;padding:6px 10px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;max-width:200px;background:transparent;color:var(--soft);padding:10px 8px}
nav button.on{color:var(--accent);background:var(--bg)}
.av{overflow:hidden;position:relative}
.av img,.banner img{position:absolute;left:0;top:0;width:100%;height:100%;max-width:none;object-fit:cover;display:block}
.av.big{width:88px;height:88px;font-size:34px;border:4px solid var(--card);margin-top:-48px}
.pcard{padding:0;overflow:hidden}
.banner{position:relative;overflow:hidden;aspect-ratio:var(--bannerRatio,3);background:linear-gradient(120deg,var(--accent),var(--warm))}
.banner .edit{z-index:2;position:absolute;right:10px;bottom:10px;padding:6px 12px;font-size:14px;background:rgba(0,0,0,.6);color:#fff}
.phead{position:relative;z-index:1;display:flex;align-items:flex-end;gap:12px;padding:0 14px 14px}
.phead .info{flex:1;min-width:0}
.pname{font-weight:800;font-size:22px;word-wrap:break-word}
/* cropper window */
#crop{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.75);display:grid;place-items:center;padding:12px}
.cbox{background:var(--card);border-radius:12px;padding:14px;width:100%;max-width:480px}
.ctitle{font-weight:800;margin-bottom:10px}
#cstage{position:relative;overflow:hidden;background:#000;touch-action:none;margin:0 auto;user-select:none;cursor:grab;border-radius:6px}
#cstage img{position:absolute;max-width:none;pointer-events:none;-webkit-user-drag:none}
#cframe{position:absolute;box-shadow:0 0 0 999px rgba(0,0,0,.62);border:2px solid #fff;pointer-events:none}
#czoom{width:100%;padding:0;margin:14px 0 4px;border:0;background:none}
</style>
</head>
<body>
<header>
  <div class="logo"><i></i><span id="appName">Porchlight</span></div>
  <div class="spacer"></div>
  <div id="who" class="row hidden"><span id="whoName" style="font-weight:700"></span><button class="ghost" id="logout">Log out</button></div>
</header>

<main>
  <!-- Log in / sign up -->
  <section id="auth" class="card hidden">
    <div class="tabs"><button id="tabIn" class="on">Log in</button><button id="tabUp">Sign up</button></div>
    <input id="uName" placeholder="Unique name" autocomplete="username" maxlength="20">
    <input id="uPass" type="password" placeholder="Password" autocomplete="current-password">
    <p class="hint" id="authHint">Welcome back. Enter your name and password.</p>
    <p class="err" id="authErr"></p>
    <button id="authGo">Log in</button>
  </section>

  <section id="app" class="hidden">
    <!-- Home: the feed -->
    <div id="view_feed"><div id="feed"></div></div>

    <!-- Upload: write a post -->
    <div id="view_upload" class="hidden">
      <div class="card">
        <textarea id="postText" placeholder="What's on your mind?"></textarea>
        <div id="prev" class="prev hidden"><img id="prevImg" alt="Photo to post"><button id="prevX">Remove</button></div>
        <p class="err" id="postErr"></p>
        <div class="bar">
          <button class="ghost" id="addPhoto">Add photo or GIF</button>
          <button id="postGo">Post</button>
        </div>
        <input id="file" type="file" accept="image/*" class="hidden">
      </div>
    </div>

    <!-- Profile: yours or someone else's -->
    <div id="view_profile" class="hidden"><div id="profile"></div></div>
    <input id="pfile" type="file" accept="image/*" class="hidden">
  </section>
</main>

<nav id="nav" class="hidden">
  <button id="nav_feed" class="on">Home</button>
  <button id="nav_upload">Upload</button>
  <button id="nav_profile">Profile</button>
</nav>

<!-- Crop window: move and zoom a picture before saving it -->
<div id="crop" class="hidden">
  <div class="cbox">
    <div class="ctitle" id="cropTitle">Move and zoom</div>
    <div id="cstage"><img id="cimg" alt=""><div id="cframe"></div></div>
    <input id="czoom" type="range" min="1" max="4" step="0.01" value="1" aria-label="Zoom">
    <p class="hint">Drag to move. Pinch, scroll or use the slider to zoom. The bright area is what people will see.</p>
    <div class="bar"><button class="ghost" id="cCancel">Cancel</button><button id="cSave">Save</button></div>
  </div>
</div>

<script>
/* ===== CUSTOMIZE HERE ===== */
const CFG = {
  appName: "Porchlight",   // site name shown in the top bar
  minPassword: 4,          // shortest allowed password
  maxPostLength: 1000,     // longest text post
  maxImageSize: 900,       // post photos are shrunk to this many pixels wide/high so they save small
  maxAvatarSize: 600,      // profile picture photos are shrunk to this size (room to zoom)
  maxBannerSize: 1600,     // banner photos are shrunk to this width (room to zoom)
  bannerRatio: 3,          // banner shape: 3 means three times wider than tall
  maxGifMB: 3              // biggest GIF allowed (GIFs are saved as they are so they keep moving)
};
/* ===== END CUSTOMIZE ===== */

const $ = id => document.getElementById(id);
let db, me = null, pendingImg = null, mode = "in";
document.documentElement.style.setProperty("--bannerRatio", CFG.bannerRatio);
$("appName").textContent = CFG.appName; document.title = CFG.appName;

/* ---------- Saving (IndexedDB: stays after you close the page) ---------- */
function openDB() {
  return new Promise((ok, fail) => {
    const r = indexedDB.open("porchlight_data", 1);
    r.onupgradeneeded = () => {
      r.result.createObjectStore("users", { keyPath: "key" });
      r.result.createObjectStore("posts", { keyPath: "id", autoIncrement: true });
    };
    r.onsuccess = () => ok(r.result);
    r.onerror = () => fail(r.error);
  });
}
function run(store, mode, fn) {
  return new Promise((ok, fail) => {
    const t = db.transaction(store, mode);
    const req = fn(t.objectStore(store));
    t.oncomplete = () => ok(req && req.result);
    t.onerror = () => fail(t.error);
  });
}

/* ---------- Passwords (never saved as plain text) ---------- */
async function hashPw(pw, salt) {
  const data = new TextEncoder().encode(salt + pw);
  if (window.crypto && crypto.subtle) {
    const b = await crypto.subtle.digest("SHA-256", data);
    return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join("");
  }
  let h = 5381; for (const c of data) h = ((h << 5) + h + c) >>> 0;   // simple fallback
  return "x" + h;
}

/* ---------- Accounts ---------- */
function setMode(m) {
  mode = m;
  $("tabIn").classList.toggle("on", m === "in");
  $("tabUp").classList.toggle("on", m === "up");
  $("authGo").textContent = m === "in" ? "Log in" : "Create profile";
  $("authHint").textContent = m === "in" ? "Welcome back. Enter your name and password."
    : "Pick a unique name (3-20 characters) and a password of at least " + CFG.minPassword + " characters.";
  $("uPass").autocomplete = m === "in" ? "current-password" : "new-password";
  $("authErr").textContent = "";
}
async function authGo() {
  const name = $("uName").value.trim(), pw = $("uPass").value, key = name.toLowerCase();
  $("authErr").textContent = "";
  if (name.length < 3 || name.length > 20) return $("authErr").textContent = "Name must be 3-20 characters.";
  if (pw.length < CFG.minPassword) return $("authErr").textContent = "Password needs at least " + CFG.minPassword + " characters.";
  const found = await run("users", "readonly", s => s.get(key));
  if (mode === "up") {
    if (found) return $("authErr").textContent = "That name is taken. Try another one.";
    const salt = Math.random().toString(36).slice(2);
    const hash = await hashPw(pw, salt);
    await run("users", "readwrite", s => s.add({ key, name, salt, hash, joined: Date.now() }));
    return enter(name);
  }
  if (!found || found.hash !== await hashPw(pw, found.salt)) return $("authErr").textContent = "Wrong name or password.";
  enter(found.name);
}
function enter(name) {
  me = name;
  try { localStorage.setItem("porchlight_me", name); } catch (e) {}
  $("uPass").value = "";
  show(); go("feed");
}
function leave() {
  me = null;
  try { localStorage.removeItem("porchlight_me"); } catch (e) {}
  show();
}
function show() {
  $("auth").classList.toggle("hidden", !!me);
  $("app").classList.toggle("hidden", !me);
  $("who").classList.toggle("hidden", !me);
  $("nav").classList.toggle("hidden", !me);
  $("whoName").textContent = me || "";
}

/* ---------- Photos and GIFs ---------- */
// Photos are shrunk so they save small. GIFs are kept as they are so they stay animated.
function readFile(file, maxSize) {
  return new Promise((ok, fail) => {
    if (file.type === "image/gif") {
      if (file.size > CFG.maxGifMB * 1048576) return fail(new Error("That GIF is too big (max " + CFG.maxGifMB + " MB)."));
      const r = new FileReader();
      r.onload = () => ok(r.result);
      r.onerror = () => fail(new Error("Could not read that file."));
      return r.readAsDataURL(file);
    }
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, maxSize / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); ok(c.toDataURL("image/jpeg", 0.82));
    };
    img.onerror = () => fail(new Error("Could not read that image."));
    img.src = url;
  });
}

/* ---------- Posts ---------- */
async function post() {
  const text = $("postText").value.trim();
  $("postErr").textContent = "";
  if (!text && !pendingImg) return $("postErr").textContent = "Write something or add a photo first.";
  if (text.length > CFG.maxPostLength) return $("postErr").textContent = "Text is too long (max " + CFG.maxPostLength + ").";
  await run("posts", "readwrite", s => s.add({ user: me, text, img: pendingImg, time: Date.now(), likes: [] }));
  $("postText").value = ""; clearPhoto(); go("feed");
}
function clearPhoto() { pendingImg = null; $("file").value = ""; $("prev").classList.add("hidden"); }
async function like(p) {
  const i = p.likes.indexOf(me);
  if (i < 0) p.likes.push(me); else p.likes.splice(i, 1);
  await run("posts", "readwrite", s => s.put(p)); render();
}
async function del(p) {
  if (!confirm("Delete this post?")) return;
  await run("posts", "readwrite", s => s.delete(p.id)); render();
}

/* ---------- Screens: feed, upload, profile ---------- */
let view = "feed", profileUser = null, feedSeed = 0, users = {}, pickKind = "";
function go(v, who) {
  if (v === "feed" && view !== "feed") feedSeed = 0;      // coming back = newest first
  view = v;
  if (v === "profile") profileUser = who || me;
  for (const n of ["feed", "upload", "profile"]) {
    $("view_" + n).classList.toggle("hidden", n !== v);
    $("nav_" + n).classList.toggle("on", n === v && (n !== "profile" || profileUser === me));
  }
  window.scrollTo(0, 0); render();
}
function home() {                                          // Home again = shuffle the feed
  if (view === "feed") { feedSeed = Math.random() * 1000 + 1; window.scrollTo(0, 0); render(); }
  else go("feed");
}
function rnd(id) { const x = Math.sin(id * 12.9898 + feedSeed) * 43758.5453; return x - Math.floor(x); }

/* ---------- Drawing (only runs when something changes) ---------- */
function color(name) { let h = 0; for (const c of name) h = (h * 31 + c.charCodeAt(0)) % 360; return "hsl(" + h + ",55%,42%)"; }
function ago(t) {
  const m = Math.floor((Date.now() - t) / 60000);
  if (m < 1) return "just now"; if (m < 60) return m + " min ago";
  if (m < 1440) return Math.floor(m / 60) + " h ago";
  return new Date(t).toLocaleDateString();
}
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
// Puts a picture in a box and shows only the chosen part (crop = fractions of the image).
// GIFs work too because this only moves and scales the image, it never redraws it.
function putImage(box, src, crop, alt) {
  const i = el("img"); i.src = src; i.alt = alt || "";
  if (crop) {
    i.style.width = (100 / crop.w) + "%"; i.style.height = (100 / crop.h) + "%";
    i.style.left = (-crop.l / crop.w * 100) + "%"; i.style.top = (-crop.t / crop.h * 100) + "%";
  }
  box.append(i);
}
function avatar(name, big) {
  const u = users[name.toLowerCase()], d = el("div", "av" + (big ? " big" : ""));
  if (u && u.avatar) putImage(d, u.avatar, u.avatarCrop, name);
  else { d.textContent = name[0].toUpperCase(); d.style.background = color(name); }
  return d;
}
function postCard(p) {
  const c = el("div", "card"), top = el("div", "row"), who = el("div"), nm = el("button", "name", p.user);
  nm.onclick = () => go("profile", p.user);
  who.append(nm, el("div", "time", ago(p.time))); top.append(avatar(p.user), who); c.append(top);
  if (p.text) c.append(el("div", "text", p.text));
  if (p.img) { const im = el("img", "photo"); im.src = p.img; im.alt = "Photo by " + p.user; c.append(im); }
  const act = el("div", "actions"), n = p.likes.length;
  const lb = el("button", "ghost" + (p.likes.includes(me) ? " liked" : ""), (n ? n + " " : "") + "Like");
  lb.onclick = () => like(p); act.append(lb);
  if (p.user === me) { const d = el("button", "ghost", "Delete"); d.onclick = () => del(p); act.append(d); }
  c.append(act); return c;
}
function drawPosts(box, posts, emptyMsg) {
  box.textContent = "";
  if (!posts.length) box.append(el("div", "card empty", emptyMsg));
  for (const p of posts) box.append(postCard(p));
}
function drawProfile(allPosts) {
  const box = $("profile"), u = users[(profileUser || "").toLowerCase()];
  box.textContent = "";
  if (!u) return box.append(el("div", "card empty", "This profile no longer exists."));
  const mine = u.name === me;
  const list = allPosts.filter(p => p.user === u.name).sort((a, b) => b.id - a.id);
  const card = el("div", "card pcard"), ban = el("div", "banner"), head = el("div", "phead"), info = el("div", "info");
  if (u.banner) putImage(ban, u.banner, u.bannerCrop, "Banner");
  if (mine) { const b = el("button", "edit", "Change banner"); b.onclick = () => pick("banner"); ban.append(b); }
  info.append(el("div", "pname", u.name), el("div", "time", "Joined " + new Date(u.joined).toLocaleDateString() + ", " + list.length + (list.length === 1 ? " post" : " posts")));
  head.append(avatar(u.name, true), info);
  if (mine) { const b = el("button", "ghost", "Change picture"); b.onclick = () => pick("avatar"); head.append(b); }
  card.append(ban, head); box.append(card);
  const wrap = el("div"); box.append(wrap);
  drawPosts(wrap, list, mine ? "You haven't posted yet. Tap Upload to share something." : u.name + " hasn't posted yet.");
}
async function render() {
  const all = await run("users", "readonly", s => s.getAll());
  users = {}; all.forEach(u => users[u.key] = u);
  const posts = await run("posts", "readonly", s => s.getAll());
  if (view === "feed") {
    posts.sort((a, b) => feedSeed ? rnd(a.id) - rnd(b.id) : b.id - a.id);
    drawPosts($("feed"), posts, "No posts yet. Tap Upload to share the first one.");
  } else if (view === "profile") drawProfile(posts);
}

/* ---------- Profile picture and banner (photo or GIF) ---------- */
function pick(kind) { pickKind = kind; $("pfile").click(); }
$("pfile").onchange = async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  try { openCrop(await readFile(f, pickKind === "banner" ? CFG.maxBannerSize : CFG.maxAvatarSize), pickKind); }
  catch (x) { alert(x.message); }
};

/* ---------- Crop window (move and zoom before saving) ---------- */
let cr = null;                       // the picture being cropped right now
const ptrs = new Map();              // fingers / mouse currently touching the stage
function openCrop(data, kind) {
  const im = new Image();
  im.onload = () => {
    const banner = kind === "banner", S = Math.min(window.innerWidth - 56, 440);
    const sw = S, sh = banner ? Math.round(S * 0.62) : S;                       // stage size
    const fw = banner ? Math.round(S * 0.94) : Math.round(S * 0.8);              // frame = visible part
    const fh = banner ? Math.round(fw / CFG.bannerRatio) : fw;
    cr = { kind, data, nw: im.naturalWidth, nh: im.naturalHeight, sw, sh, fw, fh, z: 1 };
    cr.s0 = Math.max(fw / cr.nw, fh / cr.nh);                                    // smallest size that fills the frame
    cr.cx = cr.nw / 2; cr.cy = cr.nh / 2;                                        // picture point shown in the frame center
    const st = $("cstage").style; st.width = sw + "px"; st.height = sh + "px";
    const fr = $("cframe").style; fr.width = fw + "px"; fr.height = fh + "px";
    fr.left = (sw - fw) / 2 + "px"; fr.top = (sh - fh) / 2 + "px"; fr.borderRadius = banner ? "4px" : "50%";
    $("cropTitle").textContent = banner ? "Choose your banner" : "Choose your profile picture";
    $("cimg").src = data; $("czoom").value = 1;
    $("crop").classList.remove("hidden"); drawCrop();
  };
  im.onerror = () => alert("Could not read that image.");
  im.src = data;
}
function closeCrop() { cr = null; ptrs.clear(); $("crop").classList.add("hidden"); }
function setZoom(z) { cr.z = Math.min(4, Math.max(1, z)); $("czoom").value = cr.z; }
function drawCrop() {
  const s = cr.s0 * cr.z, hw = cr.fw / 2 / s, hh = cr.fh / 2 / s;
  cr.cx = Math.min(Math.max(cr.cx, hw), cr.nw - hw);                             // keep the frame inside the picture
  cr.cy = Math.min(Math.max(cr.cy, hh), cr.nh - hh);
  const i = $("cimg").style;
  i.width = cr.nw * s + "px"; i.height = cr.nh * s + "px";
  i.left = cr.sw / 2 - cr.cx * s + "px"; i.top = cr.sh / 2 - cr.cy * s + "px";
}
const stage = $("cstage");
stage.onpointerdown = e => { stage.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY }); };
stage.onpointermove = e => {
  const p = ptrs.get(e.pointerId); if (!p || !cr) return;
  if (ptrs.size === 1) { const s = cr.s0 * cr.z; cr.cx -= (e.clientX - p.x) / s; cr.cy -= (e.clientY - p.y) / s; }
  else if (ptrs.size === 2) {                                                    // two fingers = pinch zoom
    const other = [...ptrs.entries()].find(([id]) => id !== e.pointerId)[1];
    const before = Math.hypot(p.x - other.x, p.y - other.y), after = Math.hypot(e.clientX - other.x, e.clientY - other.y);
    if (before > 0) setZoom(cr.z * after / before);
  }
  p.x = e.clientX; p.y = e.clientY; drawCrop();
};
stage.onpointerup = stage.onpointercancel = e => ptrs.delete(e.pointerId);
stage.onwheel = e => { e.preventDefault(); if (cr) { setZoom(cr.z * (e.deltaY < 0 ? 1.1 : 0.9)); drawCrop(); } };
$("czoom").oninput = e => { setZoom(+e.target.value); drawCrop(); };
$("cCancel").onclick = closeCrop;
$("cSave").onclick = async () => {
  const s = cr.s0 * cr.z;
  const crop = { l: (cr.cx - cr.fw / 2 / s) / cr.nw, t: (cr.cy - cr.fh / 2 / s) / cr.nh, w: cr.fw / s / cr.nw, h: cr.fh / s / cr.nh };
  const u = users[me.toLowerCase()]; u[cr.kind] = cr.data; u[cr.kind + "Crop"] = crop;
  await run("users", "readwrite", st => st.put(u)); closeCrop(); render();
};

/* ---------- Buttons and keys ---------- */
$("tabIn").onclick = () => setMode("in");
$("tabUp").onclick = () => setMode("up");
$("authGo").onclick = authGo;
$("uPass").onkeydown = e => { if (e.key === "Enter") authGo(); };
$("logout").onclick = leave;
$("nav_feed").onclick = home;
$("nav_upload").onclick = () => go("upload");
$("nav_profile").onclick = () => go("profile", me);
$("addPhoto").onclick = () => $("file").click();
$("file").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try { pendingImg = await readFile(f, CFG.maxImageSize); $("prevImg").src = pendingImg; $("prev").classList.remove("hidden"); }
  catch (x) { $("postErr").textContent = x.message; }
};
$("prevX").onclick = clearPhoto;
$("postGo").onclick = post;
$("postText").onkeydown = e => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) post(); };
// Shortcuts when not typing: H = home (again = shuffle), U = upload, P = my profile
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && cr) return closeCrop();
  if (!me || cr || /INPUT|TEXTAREA/.test(e.target.tagName) || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === "h") home(); else if (e.key === "u") go("upload"); else if (e.key === "p") go("profile", me);
});

/* ---------- Start ---------- */
(async () => {
  db = await openDB();
  let saved = null; try { saved = localStorage.getItem("porchlight_me"); } catch (e) {}
  if (saved) {
    const u = await run("users", "readonly", s => s.get(saved.toLowerCase()));
    if (u) me = u.name;
  }
  setMode("in"); show();
  if (me) go("feed");
})();
</script>
</body>
